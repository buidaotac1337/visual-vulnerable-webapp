<!doctype html>
<html lang="vi" data-color-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VVWA · MiniShop Security Lab</title>
    <!--
      Apply the saved colour mode before first paint (no light/dark flash, ADR-0012).
      Mirrors resolveColorMode() and COLOR_MODE_STORAGE_KEY in src/hooks/useColorMode.ts;
      a unit test keeps the key in sync. Fonts are self-hosted: no external requests.
    -->
    <script>
      (function () {
        try {
          var pref = window.localStorage.getItem('vvwa.colorMode') || 'auto';
          var dark =
            pref === 'dark' ||
            (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-color-mode', dark ? 'dark' : 'light');
        } catch (error) {
          document.documentElement.setAttribute('data-color-mode', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
