name: VVWA Quality Gates CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vvwa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Domains
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            docs:
              - 'docs/**'
              - '**/*.md'
              - 'LICENSE'
              - 'scripts/**'
              - 'pyproject.toml'
            backend:
              - 'core/backend/**'
              - 'labs/*/backend/**'
              - 'labs/*/meta.json'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
            frontend:
              - 'core/frontend/**'
              - 'labs/*/frontend/**'
              - 'scripts/**'
              - 'pyproject.toml'
            infra:
              - 'docker-compose.yml'
              - '**/Dockerfile'
              - '.dockerignore'
              - 'core/postgres/**'
              - '.github/**'
              - '.pre-commit-config.yaml'
              - '.env.example'
              - 'scripts/**'

  hygiene-gate:
    name: "Gate 0: Hygiene & Branch Rules"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup uv (pinned)
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Validate PR branch naming & PR title
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          uv run --no-project python -c "
          import os, sys
          from scripts.quality import validate_branch_name, validate_commit_message
          b = validate_branch_name(os.environ['PR_BRANCH'])
          t = validate_commit_message(os.environ['PR_TITLE'])
          for res in (b, t):
              print(res.name, 'PASS' if res.passed else res.errors)
          sys.exit(0 if (b.passed and t.passed) else 1)
          "

  docs-gate:
    name: "Gate 1: Docs & ADR Governance"
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup uv (pinned)
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Run Docs Gate (fast path, stdlib-only)
        run: uv run --no-project python scripts/gates.py --gate docs

  backend-gate:
    name: "Gate 2: Backend Logic & Quality"
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup uv (pinned)
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Sync frozen workspace
        run: uv sync --frozen

      - name: Run Backend Gate
        run: uv run --frozen python scripts/gates.py --gate backend

  frontend-gate:
    name: "Gate 3: Frontend Logic & Quality"
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup uv (pinned)
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Setup pnpm (pinned)
        uses: pnpm/action-setup@v6.1.1
        with:
          version: "10.12.1"

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.21.1"
          cache: "pnpm"
          cache-dependency-path: "core/frontend/pnpm-lock.yaml"

      - name: Install frozen frontend dependencies
        working-directory: core/frontend
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Gate
        run: uv run --no-project python scripts/gates.py --gate frontend

  infra-gate:
    name: "Gate 4: Infra & Docker Compose"
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup uv (pinned)
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Run Infra Gate (fast path, stdlib-only)
        run: uv run --no-project python scripts/gates.py --gate infra

  ci-summary:
    name: CI Quality Gate Summary
    needs: [hygiene-gate, docs-gate, backend-gate, frontend-gate, infra-gate]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate required gates
        run: |
          for result in \
            "${{ needs.hygiene-gate.result }}" \
            "${{ needs.docs-gate.result }}" \
            "${{ needs.backend-gate.result }}" \
            "${{ needs.frontend-gate.result }}" \
            "${{ needs.infra-gate.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "One or more quality gates failed (status=$result)."
              exit 1
            fi
          done
          echo "All applicable quality gates passed."
